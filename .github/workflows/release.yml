---
name: Release

"on":
  push:
    branches:
      - main

jobs:
  release_please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Create release pull request or GitHub release
        id: release
        uses: googleapis/release-please-action@v4

  publish:
    needs: release_please
    if: ${{ needs.release_please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node 26.8.1
        uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: 3.14.7

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Publish to npm if needed
        run: |
          package=$(node -e "const p=require('./package.json');process.stdout.write(p.name+'@'+p.version)")
          if npm view "$package" version >/dev/null 2>&1; then
            echo "$package is already published"
          else
            npm publish --provenance --access public
          fi
